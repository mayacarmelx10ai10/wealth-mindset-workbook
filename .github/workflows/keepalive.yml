name: keepalive
# מעיר את מסד הנתונים כל כמה ימים, כדי ש-Supabase החינמי לא יושהה בגלל חוסר פעילות
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "https://fdaixsvbzxwaqyjbaopy.supabase.co/rest/v1/published_booklets?select=slug&limit=1" -H "apikey: ${{ vars.SB_KEY }}"
