name: keepalive
# Wakes the database every few days so the free Supabase plan does not pause it
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        run: |
          curl -fsS "https://fdaixsvbzxwaqyjbaopy.supabase.co/rest/v1/published_booklets?select=slug&limit=1" -H "apikey: ${{ vars.SB_KEY }}"
